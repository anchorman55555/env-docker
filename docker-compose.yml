networks:
  bitrix:
    driver: bridge
    attachable: true
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 10.20.10.0/24

services:
  redis:
    image: redis:8.2.7-alpine
    container_name: bitrix_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - .env
    volumes:
      - /var/lib/redis:/data:z
      - ./confs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro,z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - redis

  mysql:
    image: quay.io/bitrix24/percona-server:8.0.45-v1-rhel
    container_name: bitrix_mysql
    restart: unless-stopped
    env_file:
      - .env
      - .env_sql
    volumes:
      - /var/lib/mysql/data:/var/lib/mysql:z
      - /var/lib/mysql/tmp:/var/lib/mysql/tmp:z
      - /mnt/bitrix/logs/mysql:/var/log/mysql:z
      - ./confs/mysql/etc/my.cnf.d:/etc/my.cnf.d:ro,z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cap_drop:
      - ALL
    cap_add:
      - SYS_NICE
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - mysql

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: bitrix_opensearch
    restart: unless-stopped
    environment:
      - cluster.name=bitrix-cluster
      - node.name=bitrix-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /var/lib/opensearch:/usr/share/opensearch/data:z
      - /mnt/bitrix/logs/opensearch:/usr/share/opensearch/logs:z
    init: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      bitrix:
        aliases:
          - opensearch

  php:
    image: quay.io/bitrix24/php:8.2.31-fpm-v1-alpine
    container_name: bitrix_php
    restart: unless-stopped
    env_file:
      - .env
      - .env_php
    volumes:
      - ./confs/php82/etc/:/usr/local/etc/:z
      - /mnt/bitrix/www:/opt/www/:z
      - /mnt/bitrix/upload:/opt/www/upload/:z
      - /mnt/bitrix/cache:/opt/.bx_temp/:z
      - /mnt/bitrix/session:/php_sessions:z
      - /opt/bitrix/data/msmtp:/opt/msmtp/:z
      - /opt/bitrix/data/browscap:/opt/browscap/:z
      - /opt/bitrix/data/geoip2:/opt/geoip2/:z
      - /opt/bitrix/data/ssl:/ssl/:z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - php
    depends_on:
      - mysql
      - redis
      - postfix

  cron:
    image: quay.io/bitrix24/php:8.2.31-fpm-v1-alpine
    container_name: bitrix_cron
    restart: unless-stopped
    command: crond -f -d 8
    user: root
    env_file:
      - .env
      - .env_php
    volumes:
      - ./confs/php82/etc/:/usr/local/etc/:z
      - ./confs/cron/crontabs_root:/etc/crontabs/root:ro,z
      - /mnt/bitrix/www:/opt/www/:z
      - /mnt/bitrix/upload:/opt/www/upload/:z
      - /mnt/bitrix/cache:/opt/.bx_temp/:z
      - /opt/bitrix/data/msmtp:/opt/msmtp/:z
      - /opt/bitrix/data/browscap:/opt/browscap/:z
      - /opt/bitrix/data/geoip2:/opt/geoip2/:z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - cron
    depends_on:
      - php
      - postfix

  nginx:
    image: quay.io/bitrix24/nginx:1.30.2-v1-alpine
    container_name: bitrix_nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./confs/nginx/:/etc/nginx/:z
      - /mnt/bitrix/www:/opt/www/:z
      - /mnt/bitrix/upload:/opt/www/upload/:z
      - /mnt/bitrix/cache:/opt/.bx_temp/:z
      - /opt/bitrix/data/ssl:/ssl/:z
      - /mnt/bitrix/logs/nginx:/var/log/nginx:z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - nginx
    depends_on:
      - php
      - postfix

  push-sub:
    image: quay.io/bitrix24/push:3.3-v1-alpine
    container_name: bitrix_push_sub
    restart: unless-stopped
    env_file:
      - .env
      - .env_push
      - .env_push_sub
      - .env_redis
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - push_sub
    depends_on:
      - redis

  push-pub:
    image: quay.io/bitrix24/push:3.3-v1-alpine
    container_name: bitrix_push_pub
    restart: unless-stopped
    env_file:
      - .env
      - .env_push
      - .env_push_pub
      - .env_redis
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - push_pub
    depends_on:
      - redis

  postfix:
    image: bitrix_postfix:latest
    container_name: bitrix_postfix
    restart: unless-stopped
    hostname: crm.cifroweek.com
    environment:
      SMTP_SERVER: smtp.mail.ru
      SMTP_PORT: "587"
      HELO_NAME: crm.cifroweek.com
      SMTP_SECURITY: encrypt
      SMTP_LOGIN_PORTAL: info@crm.cifroweek.com
      SMTP_PASSWORD_PORTAL: sZnmbBeIHVldtbf9xgoW
      SMTP_LOGIN_SHOP: info@cifroweek.com
      SMTP_PASSWORD_SHOP: gF7Be6guXbmDllUUVsyL
      SMTP_DEFAULT_LOGIN: info@crm.cifroweek.com
      SMTP_DEFAULT_PASSWORD: sZnmbBeIHVldtbf9xgoW
      MYNETWORKS: "127.0.0.0/8 10.20.10.0/24"
    volumes:
      - /var/spool/postfix:/var/spool/postfix:z
    init: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SYS_CHROOT
    networks:
      bitrix:
        aliases:
          - postfix


  ssl:
    image: quay.io/bitrix24/ssl:1.2-v1-alpine
    container_name: bitrix_ssl
    restart: unless-stopped
    env_file:
      - .env
      - .env_ssl
    volumes:
      - /opt/bitrix/data/ssl:/ssl/:z
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      bitrix:
        aliases:
          - ssl
    depends_on:
      - nginx
