ssl_certificate /ssl/crm.cifroweek.com.fullchain.cert.pem;
ssl_certificate_key /ssl/crm.cifroweek.com.key.pem;
ssl_trusted_certificate /ssl/ca-chain.cert.pem;
#
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_ecdh_curve prime256v1:secp384r1:secp521r1:X25519;
ssl_early_data on;
#
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets on;
#
ssl_stapling off;
ssl_stapling_verify off;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;
#
add_header Strict-Transport-Security "max-age=15552000;";
#
ssl_buffer_size 4k;
keepalive_timeout 70;
keepalive_requests 1000;
#
http2 on;
http2_body_preread_size 64k;
http2_chunk_size 8k;
http2_max_concurrent_streams 128;
