#
# Push & Pull: WebSocket subscriber (browsers -> push_sub:8010)
#
location /bitrix/subws/ {
    proxy_pass http://push_sub:8010/bitrix/subws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
#
# Push & Pull: long-polling subscriber (maps to push_sub /bitrix/subws/ route)
#
location /bitrix/sub/ {
    proxy_pass http://push_sub:8010/bitrix/subws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
#
# Push & Pull: publisher endpoint
#
location /bitrix/pub/ {
    proxy_pass http://push_pub:9010/bitrix/pub/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
#
# Push & Pull: REST API
#
location /bitrix/rest/ {
    proxy_pass http://push_pub:9010/bitrix/rest/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
#
location /server-stat/ {
    proxy_pass http://push_pub:9010/server-stat/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    allow 127.0.0.1;
    allow 10.20.10.0/24;
    deny all;
}
#
